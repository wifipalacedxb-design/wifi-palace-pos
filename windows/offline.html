<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Palace POS</title><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><style>body{margin:0;height:100vh;display:grid;place-items:center;background:#19172e;color:#fff;font:16px "Segoe UI",system-ui,sans-serif;text-align:center}.box{max-width:460px;padding:24px}.logo{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#9b7df0,#6354c7);display:grid;place-items:center;font-weight:700;font-size:26px;margin:0 auto 18px}p{color:#c9c4e8;line-height:1.5}button{margin-top:18px;padding:12px 28px;border:0;border-radius:10px;background:#6354c7;color:#fff;font:inherit;cursor:pointer}</style></head>
<body><div class="box"><div class="logo">WP</div><h2>No connection</h2><p>Palace POS needs the internet the first time you sign in on this computer. After that it keeps working offline for the period your plan allows.</p><p>Check the network cable or Wi-Fi, then try again.</p><button id="retry">Try again</button></div>
<script>document.getElementById('retry').onclick=()=>{const u=new URLSearchParams(location.search).get('url');if(u&&/^https?:\/\//.test(u))location.href=u};</script></body></html>
