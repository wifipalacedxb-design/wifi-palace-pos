services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${SALON_DOMAIN:?Set SALON_DOMAIN in .env}
    volumes:
      - salon_data:/app/data
    expose:
      - "8080"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SALON_DOMAIN: ${SALON_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  salon_data:
  caddy_data:
  caddy_config:
